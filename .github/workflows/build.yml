name: Build IPA

on:
  repository_dispatch:
    types: [build_ipa]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Unzip Project
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          unzip $ZIP_FILE

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd OfflineMusicApp
          npm install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Turtle & Build
        run: |
          cd OfflineMusicApp
          npm install -g turtle-cli
          expo export --public-url https://google.com
          turtle build:ios --type simulator --export-dir ./out

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-ipa
          path: OfflineMusicApp/out/*.tar.gz
