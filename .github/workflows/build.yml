name: Build IPA

on:
  repository_dispatch:
    types: [build_ipa]
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Name of the project'
        required: true
        default: 'MyApp'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build IPA (Ad-Hoc/Unsigned)
        run: |
          # Download the source from the artifact path or use the uploaded zip
          # The backend pushes the zip to the root of the repo
          unzip ${{ github.event.client_payload.filename }}
          
          # This is a simplified build command. 
          # In a real scenario, you might need to handle schemas and configurations.
          xcodebuild -project *.xcodeproj -scheme $(xcodebuild -list -project *.xcodeproj | grep "Schemes:" -A 2 | tail -1 | xargs) -archivePath MyApp.xcarchive archive
          
          # Export to IPA
          mkdir -p Payload
          cp -r MyApp.xcarchive/Products/Applications/*.app Payload/
          zip -r MyApp.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: MyApp.ipa
